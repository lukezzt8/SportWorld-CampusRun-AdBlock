# 运动世界校园 去广告 — 独立配置 (可直接导入)
# 共 129 条广告拦截规则 (30 条进程隔离防误伤 + 99 条纯广告 SDK)
#
# 含一个直连占位节点(仅为通过客户端的 proxies 校验), 不含任何真实节点。
# 导入后除广告域名被拒绝外, 其余流量全部直连。
#
# 如需配合自己的代理订阅使用, 请参考 docs/merge-guide.md

mixed-port: 7899
mode: rule
log-level: info
ipv6: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxies:
  - name: DIRECT-PLACEHOLDER
    type: direct
    udp: true

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - DIRECT-PLACEHOLDER

