# 运动世界校园 广告域名拦截规则 / Clash rule-provider
# CampusRun Ad-Block Ruleset for Clash / mihomo
#
# 规则条数: 128 (99 父域 + 29 精确)
# 数据来源: APK 静态逆向 + 手机实测日志验证
#
# 用法 (rule-provider):
#   1. 将本文件放入 Clash 配置目录的 ruleset/ 下
#   2. 在配置中声明:
#        rule-providers:
#          campusrun:
#            type: file
#            behavior: domain
#            format: yaml
#            path: ./ruleset/campusrun.yaml
#   3. 在 rules: 的最前面加入:
#        - 'RULE-SET,campusrun,REJECT'
#
# 或直接用在线地址 (无需下载):
#   https://cdn.jsdelivr.net/gh/lukezzt8/SportWorld-CampusRun-AdBlock@main/rules/campusrun.yaml
#
# 注意: 放在 rules 最前面才会生效, 规则按顺序匹配。

